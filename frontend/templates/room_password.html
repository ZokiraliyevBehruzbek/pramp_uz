{% extends 'base.html' %}
{% block title %}Xonaga kirish — PeerView{% endblock %}
{% block bodyclass %}page-auth{% endblock %}
{% block content %}
<div class="auth-box">
  <a href="/dashboard/" class="brand">Peer<span>View</span></a>
  <h1>🔒 {{ room.name }}</h1>
  <p class="sub">Xonaga kirish uchun parol kiriting</p>
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="fg"><label>Parol</label><input name="password" type="password" autofocus required placeholder="••••••"></div>
    <button type="submit" class="btn btn-primary btn-full">Kirish</button>
  </form>
  <p class="sw"><a href="/dashboard/">← Dashboard</a></p>
</div>
{% endblock %}
